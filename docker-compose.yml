services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rpgassets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpgassets_dev}
      POSTGRES_DB: rpgassets
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Host-side bind stays on loopback, same rule as the api service below.
    ports:
      - "127.0.0.1:5433:5432"

  api:
    image: ghcr.io/elemorelli/rpg-assets-manager:latest
    build:
      context: .
      args:
        UID: "1000"
        GID: "1000"
    environment:
      DATABASE_URL: postgres://rpgassets:${POSTGRES_PASSWORD:-rpgassets_dev}@postgres:5432/rpgassets
      PORT: "3001"
      # 0.0.0.0 here is the in-container bind, reachable only through the
      # compose network. The host-facing bind below stays on loopback.
      HOST: "0.0.0.0"
      WEB_DIST_DIR: /app/dist/web
      ASSET_TREE_ROOT: /assets
      THUMBNAIL_CACHE_DIR: /thumbnails
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Unset or "true" keeps apply in log-only mode; only an explicit
      # "false" lets it run rclone and Cloudflare purges for real.
      DRY_RUN: ${DRY_RUN:-true}
      RCLONE_REMOTE: ${RCLONE_REMOTE}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY}
      CF_ZONE_ID: ${CF_ZONE_ID}
      CF_API_TOKEN: ${CF_API_TOKEN}
      ASSETS_PUBLIC_BASE_URL: ${ASSETS_PUBLIC_BASE_URL}
      FOUNDRY_WORLD_NAMES: ${FOUNDRY_WORLD_NAMES}
    volumes:
      - ${ASSET_TREE_HOST_PATH:-./fixtures/tree}:/assets
      - thumb-cache:/thumbnails
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - postgres

volumes:
  pg-data:
  thumb-cache:
